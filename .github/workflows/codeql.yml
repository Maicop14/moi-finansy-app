name: Проверка кода

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # каждый понедельник

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL — безопасность и качество (Swift)
    # GitHub CodeQL пока не поддерживает Swift 6.4 / Xcode 27, а Xcode 26 падает на этом коде с внутренней ошибкой
    # компилятора. Запуск вручную (Actions → «Проверка кода» → Run workflow), когда GitHub добавит поддержку.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26   # CodeQL анализирует Swift только с Xcode 26 и ниже
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26 (CodeQL пока не поддерживает Swift 6.4)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Сборка
        run: |
          set -o pipefail
          xcodebuild -version
          swift build 2>&1 | tee build.log || { grep -E "error:" build.log | head -20 | sed 's/^/::error::/'; exit 1; }

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
          output: sarif-results

      - name: Сводка находок
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os
          rows = []
          for path in glob.glob("sarif-results/*.sarif"):
              data = json.load(open(path))
              for run in data.get("runs", []):
                  rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                  for res in run.get("results", []):
                      loc = res.get("locations", [{}])[0].get("physicalLocation", {})
                      file = loc.get("artifactLocation", {}).get("uri", "?")
                      line = loc.get("region", {}).get("startLine", "?")
                      rule = res.get("ruleId", "?")
                      severity = rules.get(rule, {}).get("properties", {}).get("problem.severity", res.get("level", ""))
                      text = res.get("message", {}).get("text", "").replace("\n", " ").replace("|", "/")
                      rows.append((severity, rule, f"{file}:{line}", text[:200]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"## CodeQL: находок {len(rows)}\n\n")
              if rows:
                  out.write("| Уровень | Правило | Где | Описание |\n|---|---|---|---|\n")
                  for r in sorted(rows):
                      out.write("| " + " | ".join(str(x) for x in r) + " |\n")
              else:
                  out.write("Замечаний нет.\n")
          print("findings:", len(rows))
          PY

  tests:
    name: Тесты (swift test)
    runs-on: xcode-27   # тот же Xcode 27, что и для сборки приложения
    steps:
      - uses: actions/checkout@v5
      - name: Тесты
        run: |
          set -o pipefail
          xcodebuild -version
          swift test 2>&1 | tee test.log || { grep -E "error:|✘|failed" test.log | head -25 | sed 's/^/::error::/'; exit 1; }
